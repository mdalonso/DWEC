<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habilitar un campo según otro</title>
  <link rel="stylesheet" href="./css/estilos.css" />
</head>
<body>
  <h1>Habilitar un campo según otro</h1>
  <p>El número de expediente solo se pide si la persona es alumna del centro. Prueba a enviar con la casilla marcada y sin marcar, y observa qué datos se envían.</p>

  <form name="inscripcion">
    <div class="campo">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required>
    </div>

    <label><input type="checkbox" id="esAlumno" name="esAlumno"> Soy alumno/a del centro</label>

    <div class="campo">
      <label for="expediente">N.º de expediente</label>
      <!-- Empieza deshabilitado: mientras lo esté, ni se valida ni se envía -->
      <input type="text" id="expediente" name="expediente" disabled required>
    </div>

    <div class="botones">
      <button type="submit">Enviar</button>
      <button type="reset">Reset</button>
    </div>
  </form>

  <h2>Estado</h2>
  <pre id="salida"></pre>

  <script src="./js/app.js"></script>
  <noscript>El navegador no soporta JavaScript</noscript>
</body>
</html>
