<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al formulario y sus controles</title>
   <link rel="stylesheet" href="./css/estilos.css" />
</head>
<body>
  <h1>Acceso al formulario y sus controles</h1>
  <p>Escribe algo, elige un turno y pulsa <strong>Enviar</strong>. Abajo verás lo que devuelve cada forma de acceso. Abre también la consola (F12).</p>

  <form id="registro" name="registroName">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombreName">

    <label for="email">Correo electrónico</label>
    <input type="email" id="email" name="emailName">

    <div class="radios">
      <label><input type="radio" name="turno" value="mañana"> Mañana</label>
      <label><input type="radio" name="turno" value="tarde"> Tarde</label>
    </div>

    <button type="submit">Enviar</button>
  </form>

  <h2>Resultado</h2>
  <pre id="salida">Pulsa Enviar para ver los resultados.</pre>

  <script src="./js/app.js"></script>
  <noscript>El navegador no soporta JavaScript</noscript>
</body>
</html>
